<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 고양이와 함께 한국어 배우기! | Learn Korean with Cats</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #c9e8ff 0%, #a0c4ff 50%, #748fdb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 52, 120, 0.15);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%230055a4' fill-opacity='0.04' fill-rule='nonzero'%3E%3Ccircle cx='30' cy='30' r='4'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E") repeat;
            animation: float 20s infinite linear;
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .header {
            position: relative;
            z-index: 1;
            margin-bottom: 2rem;
        }

        .title {
            color: #1a2a5e;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.08);
        }

        .subtitle {
            color: #6b7db3;
            font-size: 1.1rem;
            font-weight: 300;
        }

        .cat-container {
            position: relative;
            z-index: 1;
            margin: 2rem 0;
        }

        .cat-image {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid #fff;
            box-shadow: 0 10px 30px rgba(0, 52, 120, 0.2);
            transition: transform 0.3s ease;
        }

        .cat-image:hover {
            transform: scale(1.05);
        }

        .phrase-container {
            position: relative;
            z-index: 1;
            background: linear-gradient(135deg, #dbeafe, #bfdbfe);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
            border: 3px solid #fff;
            box-shadow: 0 8px 25px rgba(0, 52, 120, 0.1);
        }

        .korean-phrase {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a2a5e;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .english-translation {
            font-size: 1.2rem;
            color: #4a5899;
            font-weight: 400;
            font-style: italic;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.35);
            font-family: 'Noto Sans KR', sans-serif;
            margin: 1.5rem 0;
        }

        .refresh-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(59, 130, 246, 0.45);
        }

        .refresh-btn:active {
            transform: translateY(-1px);
        }

        .motivation-text {
            color: #748fdb;
            font-size: 1rem;
            font-weight: 400;
            margin-top: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .paw-prints {
            position: absolute;
            font-size: 1.5rem;
            color: rgba(59, 130, 246, 0.25);
            animation: bounce 2s infinite;
        }

        .paw1 { top: 10%; left: 10%; animation-delay: 0s; }
        .paw2 { top: 20%; right: 15%; animation-delay: 0.5s; }
        .paw3 { bottom: 30%; left: 8%; animation-delay: 1s; }
        .paw4 { bottom: 15%; right: 12%; animation-delay: 1.5s; }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .progress-bar {
            background: rgba(59, 130, 246, 0.15);
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
            margin: 1.5rem 0;
            position: relative;
            z-index: 1;
        }

        .progress-fill {
            background: linear-gradient(90deg, #60a5fa, #1d4ed8);
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #6b7db3;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 600px) {
            .container {
                width: 95%;
                padding: 1.5rem;
            }

            .title {
                font-size: 2rem;
            }

            .cat-image {
                width: 150px;
                height: 150px;
            }

            .korean-phrase {
                font-size: 1.4rem;
            }

            .english-translation {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="paw-prints paw1">🐾</div>
        <div class="paw-prints paw2">🐾</div>
        <div class="paw-prints paw3">🐾</div>
        <div class="paw-prints paw4">🐾</div>

        <div class="header">
            <h1 class="title">🐱 한국어 고양이 🐱</h1>
            <p class="subtitle">Learn Korean with adorable cats!</p>
        </div>

        <div class="cat-container">
            <img id="catImage" class="cat-image" src="https://cataas.com/cat/says/annyeong?size=200&color=white&fontSize=28" alt="Cute cat" />
        </div>

        <div class="phrase-container">
            <div id="koreanPhrase" class="korean-phrase">클릭해서 시작하세요!</div>
            <div id="englishTranslation" class="english-translation">Click to start!</div>
        </div>

        <button id="refreshBtn" class="refresh-btn">🔄 다음 문장!</button>

        <div class="progress-bar">
            <div id="progressFill" class="progress-fill" style="width: 0%"></div>
        </div>

        <div class="stats">
            <span>배운 문장: <span id="phrasesLearned">0</span></span>
            <span>레벨: 초급 🌟</span>
        </div>

        <p class="motivation-text">
            매일 조금씩 배우면 한국어 실력이 늘어요! 💪
        </p>
    </div>

    <script>
        const phrases = [
            {
                korean: "내 고양이는 소파에서 자는 것을 좋아해요.",
                english: "My cat likes to sleep on the sofa.",
                keywords: ["sleep", "sofa"]
            },
            {
                korean: "작은 아기 고양이가 실타래로 놀아요.",
                english: "The little kitten plays with a ball of yarn.",
                keywords: ["kitten", "yarn"]
            },
            {
                korean: "우리 고양이는 매일 아침 사료를 먹어요.",
                english: "My cat eats kibble every morning.",
                keywords: ["eat", "morning"]
            },
            {
                korean: "이 검은 고양이가 정원에서 달려요.",
                english: "This black cat runs in the garden.",
                keywords: ["black", "garden"]
            },
            {
                korean: "내 고양이는 내가 쓰다듬을 때 그릉그릉 거려요.",
                english: "My cat purrs when I pet it.",
                keywords: ["purr", "pet"]
            },
            {
                korean: "고양이가 나무에 매우 빠르게 올라가요.",
                english: "The cat climbs the tree very quickly.",
                keywords: ["climb", "tree"]
            },
            {
                korean: "나는 고양이 두 마리가 있어요: 주황색과 흰색.",
                english: "I have two cats: one orange and one white.",
                keywords: ["orange", "white"]
            },
            {
                korean: "수의사가 아픈 고양이를 진찰해요.",
                english: "The veterinarian examines the sick cat.",
                keywords: ["vet", "sick"]
            },
            {
                korean: "아기 고양이가 그릇에서 우유를 마셔요.",
                english: "The kitten drinks milk from the bowl.",
                keywords: ["milk", "bowl"]
            },
            {
                korean: "고양이들은 밤에 쥐를 사냥해요.",
                english: "Cats hunt mice at night.",
                keywords: ["hunt", "night"]
            },
            {
                korean: "고양이가 부엌 문 앞에서 기다려요.",
                english: "The cat waits in front of the kitchen door.",
                keywords: ["wait", "kitchen"]
            },
            {
                korean: "고양이가 침대 아래에 숨어요.",
                english: "The cat hides under the bed.",
                keywords: ["hide", "bed"]
            },
            {
                korean: "나는 고양이를 위해 장난감을 사요.",
                english: "I buy toys for my cat.",
                keywords: ["toys", "buy"]
            },
            {
                korean: "고양이가 빈 밥그릇 앞에서 야옹거려요.",
                english: "The cat meows in front of its empty bowl.",
                keywords: ["meow", "empty"]
            },
            {
                korean: "내 고양이는 발코니를 산책하는 것을 좋아해요.",
                english: "My cat loves to walk on the balcony.",
                keywords: ["balcony", "walk"]
            },
            {
                korean: "이 주황색 고양이는 매우 애교가 많아요.",
                english: "This orange cat is very affectionate.",
                keywords: ["cute", "fluffy"]
            },
            {
                korean: "우리 고양이는 식사 후 발을 핥아요.",
                english: "My cat licks its paws after eating.",
                keywords: ["paws", "clean"]
            },
            {
                korean: "고양이가 창문으로 새들을 바라봐요.",
                english: "The cat watches the birds through the window.",
                keywords: ["birds", "window"]
            },
            {
                korean: "나이 든 고양이는 집에 있는 것을 좋아해요.",
                english: "The old cat prefers to stay at home.",
                keywords: ["old", "home"]
            },
            {
                korean: "기분이 좋을 때 고양이 꼬리가 움직여요.",
                english: "The cat's tail moves when it is happy.",
                keywords: ["tail", "happy"]
            }
        ];

        let phrasesLearnedCount = 0;

        const koreanPhraseElement = document.getElementById('koreanPhrase');
        const englishTranslationElement = document.getElementById('englishTranslation');
        const catImageElement = document.getElementById('catImage');
        const refreshBtn = document.getElementById('refreshBtn');
        const progressFillElement = document.getElementById('progressFill');
        const phrasesLearnedElement = document.getElementById('phrasesLearned');

        function getRandomPhrase() {
            return phrases[Math.floor(Math.random() * phrases.length)];
        }

        function generateCatImageUrl(phrase) {
            const keyword = phrase.keywords[Math.floor(Math.random() * phrase.keywords.length)];
            const colors = ['white', 'black', 'orange', 'gray', 'blue'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            return `https://cataas.com/cat/says/${encodeURIComponent(keyword)}?size=200&color=${color}&fontSize=25`;
        }

        function updatePhrase() {
            const phrase = getRandomPhrase();

            koreanPhraseElement.style.opacity = '0';
            englishTranslationElement.style.opacity = '0';
            catImageElement.style.opacity = '0';

            setTimeout(() => {
                koreanPhraseElement.textContent = phrase.korean;
                englishTranslationElement.textContent = phrase.english;
                catImageElement.src = generateCatImageUrl(phrase);

                koreanPhraseElement.style.opacity = '1';
                englishTranslationElement.style.opacity = '1';
                catImageElement.style.opacity = '1';
            }, 200);

            phrasesLearnedCount++;
            phrasesLearnedElement.textContent = phrasesLearnedCount;

            const progressPercentage = Math.min((phrasesLearnedCount / phrases.length) * 100, 100);
            progressFillElement.style.width = `${progressPercentage}%`;

            if (phrasesLearnedCount === phrases.length) {
                setTimeout(() => {
                    confetti();
                    alert('🎉 축하해요! 모든 문장을 봤어요! 🎉\n\nCongratulations! You\'ve seen all the phrases!');
                }, 500);
            }
        }

        function confetti() {
            for (let i = 0; i < 50; i++) {
                createConfettiPiece();
            }
        }

        function createConfettiPiece() {
            const confetti = document.createElement('div');
            confetti.textContent = ['🎉', '🐱', '💙', '⭐', '🌟'][Math.floor(Math.random() * 5)];
            confetti.style.position = 'fixed';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.top = '-10px';
            confetti.style.fontSize = '20px';
            confetti.style.pointerEvents = 'none';
            confetti.style.zIndex = '1000';

            document.body.appendChild(confetti);

            const animation = confetti.animate([
                { transform: 'translateY(0px) rotate(0deg)', opacity: 1 },
                { transform: `translateY(${window.innerHeight + 100}px) rotate(360deg)`, opacity: 0 }
            ], {
                duration: 3000,
                easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
            });

            animation.addEventListener('finish', () => {
                confetti.remove();
            });
        }

        koreanPhraseElement.style.transition = 'opacity 0.3s ease';
        englishTranslationElement.style.transition = 'opacity 0.3s ease';
        catImageElement.style.transition = 'opacity 0.3s ease';

        refreshBtn.addEventListener('click', updatePhrase);

        updatePhrase();
        phrasesLearnedCount = 0;
        phrasesLearnedElement.textContent = '0';
        progressFillElement.style.width = '0%';
    </script>
</body>
</html>
